<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동적 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script>
        window.onload = function () {
            const userinput = document.getElementById("userinput");
            const plus = document.getElementById("plus");
            const addul = document.getElementById("addul");

            function delform(e) {
                e.target.parentElement.remove();
            }

            function addItem() {
                const text = userinput.value.trim();

                if (text === "") {
                    alert("내용을 입력하세요.");
                    userinput.focus();
                    return;
                }

                // li 요소 생성
                const li = document.createElement("li");
                const span = document.createElement("span");
                span.innerText = text;

                // 삭제 버튼 생성
                const delbtn = document.createElement("button");
                delbtn.innerText = "삭제";
                delbtn.className = "delbtn";
                delbtn.addEventListener("click", delform);

                li.appendChild(span);
                li.appendChild(delbtn);
                addul.appendChild(li);

                userinput.value = "";
                userinput.focus();
            }

            plus.addEventListener("click", addItem);s

        };
    </script>

    <style>
        body {
            max-width: 500px;
            margin: 40px auto;
            font-family: sans-serif;
        }

        h2 {
            margin-bottom: 16px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        #plus {
            padding: 8px 16px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #plus:hover {
            background-color: #357abd;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            margin-bottom: 8px;
            background-color: #f0f9f4;
            border-left: 4px solid rgb(13, 179, 65);
            border-radius: 6px;
            color: rgb(13, 179, 65);
        }

        .delbtn {
            padding: 4px 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delbtn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <h2 >동적 리스트</h2>
    <div class="input-area">
        <input type="text" id="userinput" placeholder="항목을 입력하세요">
        <button id="plus">추가</button>
    </div>
    <ul id="addul"></ul>
</body>
</html>
