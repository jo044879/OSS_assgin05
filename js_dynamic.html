<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동적 리스트</title>
   
    <script>
        window.onload = function () {
            const userinput = document.getElementById("userinput");
            const plus = document.getElementById("plus");
            const addul = document.getElementById("addul");

            function delform(e) {
                e.target.parentElement.remove();
            }

            function addItem() {
                const text = userinput.value.trim();

                if (text === "") {
                    alert("내용을 입력하세요.");
                    userinput.focus();
                    return;
                }

                // li 요소 생성
                const li = document.createElement("li");
                const span = document.createElement("span");
                span.innerText = text;

                // 삭제 버튼 생성
                const delbtn = document.createElement("button");
                delbtn.innerText = "삭제";
                delbtn.className = "delbtn";
                delbtn.addEventListener("click", delform);

                li.appendChild(span);
                li.appendChild(delbtn);
                addul.appendChild(li);

                userinput.value = "";
                userinput.focus();
            }

            plus.addEventListener("click", addItem);

        };
    </script>
</head>
<body>
    <h2>동적 리스트</h2>
    <div class="input-area">
        <input type="text" id="userinput" placeholder="항목을 입력하세요">
        <button id="plus">추가</button>
    </div>
    <ul id="addul"></ul>
</body>
</html>
