<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리</title>
    <script src="crud.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light py-4">

    <div class="container">

        <h1 class="text-center mb-4">상품 관리</h1>

        <section class="form-section card shadow-sm mx-auto mb-4" style="max-width: 600px;">
            <div class="card-body">
                <h2 id="formTitle" class="h5 card-title border-bottom border-primary border-2 pb-2 mb-3">상품 추가</h2>

                <div class="form-row row mb-3 align-items-center">
                    <label for="inputName" class="col-sm-3 col-form-label fw-bold">상품명</label>
                    <div class="col-sm-9">
                        <input type="text" id="inputName" class="form-control" placeholder="상품명을 입력하세요">
                    </div>
                </div>

                <div class="form-row row mb-3 align-items-center">
                    <label for="inputNum" class="col-sm-3 col-form-label fw-bold">상품번호</label>
                    <div class="col-sm-9">
                        <input type="text" id="inputNum" class="form-control" placeholder="예: ITEM-001">
                    </div>
                </div>

                <div class="form-row row mb-3 align-items-center">
                    <label for="inputPrice" class="col-sm-3 col-form-label fw-bold">가격(원)</label>
                    <div class="col-sm-9">
                        <input type="number" id="inputPrice" class="form-control" placeholder="0 이상의 숫자">
                    </div>
                </div>

                <div class="form-row row mb-3 align-items-center">
                    <label for="inputMarket" class="col-sm-3 col-form-label fw-bold">매장명</label>
                    <div class="col-sm-9">
                        <input type="text" id="inputMarket" class="form-control" placeholder="매장명을 입력하세요">
                    </div>
                </div>

                <div class="form-row row mb-3 align-items-center">
                    <label for="inputAddress" class="col-sm-3 col-form-label fw-bold">배송지</label>
                    <div class="col-sm-9">
                        <input type="text" id="inputAddress" class="form-control" placeholder="배송지를 입력하세요">
                    </div>
                </div>

                <div class="form-row row mb-3 align-items-center">
                    <label for="inputCategory" class="col-sm-3 col-form-label fw-bold">카테고리</label>
                    <div class="col-sm-9">
                        <select id="inputCategory" class="form-select">
                            <option value="">-- 선택 --</option>
                            <option value="전자제품">전자제품</option>
                            <option value="생활용품">생활용품</option>
                            <option value="식품">식품</option>
                            <option value="의류">의류</option>
                            <option value="기타">기타</option>
                        </select>
                    </div>
                </div>

                <div class="btn-area text-end mt-3">
                    <button id="cancelBtn" class="btn btn-secondary me-2" style="display: none;">취소</button>
                    <button id="submitBtn" class="btn btn-primary">Add</button>
                </div>
            </div>
        </section>

        <section class="list-section card shadow-sm mx-auto" style="max-width: 960px;">
            <div class="card-body">
                <h2 class="h5 card-title border-bottom border-primary border-2 pb-2 mb-3">상품 목록</h2>
                <div class="table-responsive">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>상품명</th>
                                <th>상품번호</th>
                                <th>가격</th>
                                <th>매장명</th>
                                <th>배송지</th>
                                <th>카테고리</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody"></tbody>
                    </table>
                </div>
            </div>
        </section>

    </div>

</body>
</html>
