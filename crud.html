<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 관리</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            color: #2c3e50;
        }

        /* ── 입력 영역 ── */
        .form-section {
            background: #fff;
            border-radius: 8px;
            padding: 24px 28px;
            max-width: 600px;
            margin: 0 auto 36px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-section h2 {
            font-size: 18px;
            margin-bottom: 18px;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }

        .form-row label {
            width: 90px;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .form-row input,
        .form-row select {
            flex: 1;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-row input:focus,
        .form-row select:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn-area {
            text-align: right;
            margin-top: 18px;
        }

        #submitBtn {
            padding: 9px 24px;
            font-size: 15px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #submitBtn:hover {
            background-color: #2980b9;
        }

        #cancelBtn {
            padding: 9px 18px;
            font-size: 15px;
            background-color: #95a5a6;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 8px;
            display: none;
        }

        #cancelBtn:hover {
            background-color: #7f8c8d;
        }

        /* ── 출력 영역 ── */
        .list-section {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            padding: 24px 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .list-section h2 {
            font-size: 18px;
            margin-bottom: 18px;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background-color: #3498db;
            color: #fff;
            padding: 10px 12px;
            text-align: center;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: center;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f0f7ff;
        }

        .btn-edit {
            padding: 4px 12px;
            font-size: 13px;
            background-color: #f39c12;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
        }

        .btn-edit:hover {
            background-color: #e67e22;
        }

        .btn-del {
            padding: 4px 12px;
            font-size: 13px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-del:hover {
            background-color: #c0392b;
        }

        .empty-msg {
            text-align: center;
            color: #999;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <h1>🛒 상품 관리</h1>

    <!-- 입력 영역 -->
    <section class="form-section">
        <h2 id="formTitle">상품 추가</h2>

        <div class="form-row">
            <label for="inputName">상품명</label>
            <input type="text" id="inputName" placeholder="상품명을 입력하세요">
        </div>

        <div class="form-row">
            <label for="inputNum">상품번호</label>
            <input type="text" id="inputNum" placeholder="예: ITEM-001">
        </div>

        <div class="form-row">
            <label for="inputPrice">가격(원)</label>
            <input type="number" id="inputPrice" placeholder="0 이상의 숫자">
        </div>

        <div class="form-row">
            <label for="inputMarket">매장명</label>
            <input type="text" id="inputMarket" placeholder="매장명을 입력하세요">
        </div>

        <div class="form-row">
            <label for="inputAddress">배송지</label>
            <input type="text" id="inputAddress" placeholder="배송지를 입력하세요">
        </div>

        <div class="form-row">
            <label for="inputCategory">카테고리</label>
            <select id="inputCategory">
                <option value="">-- 선택 --</option>
                <option value="전자제품">전자제품</option>
                <option value="생활용품">생활용품</option>
                <option value="식품">식품</option>
                <option value="의류">의류</option>
                <option value="기타">기타</option>
            </select>
        </div>

        <div class="btn-area">
            <button id="cancelBtn">취소</button>
            <button id="submitBtn">Add</button>
        </div>
    </section>

    <!-- 출력 영역 -->
    <section class="list-section">
        <h2>상품 목록</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>상품명</th>
                    <th>상품번호</th>
                    <th>가격</th>
                    <th>매장명</th>
                    <th>배송지</th>
                    <th>카테고리</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
        </table>
    </section>

    <script src="crud.js"></script>
</body>
</html>
